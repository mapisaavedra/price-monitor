name: Update prices

on:
  schedule:
    - cron: '7 * * * *'      # cada hora (minuto 7 para evitar congestión de :00)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['price_monitor/**', 'config.yaml']

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch prices, evaluate alerts, build dashboard data
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python -m price_monitor --config config.yaml

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase && git push
