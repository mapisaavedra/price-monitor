[project]
name = "price-monitor"
version = "2.0.0"
description = "Monitor de precios cripto con alertas, métricas de riesgo y dashboard en GitHub Pages"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "pandas>=2.1", "pyyaml>=6.0"]

[project.scripts]
price-monitor = "price_monitor.cli:main"

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
